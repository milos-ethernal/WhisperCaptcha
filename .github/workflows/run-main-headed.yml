name: Run main.py (headed)

on:
  workflow_dispatch:
  push:
    branches:
      - sepolia-pow
  pull_request:

jobs:
  run-script-headed:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ffmpeg and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script (headed via Xvfb)
        env:
          CI: "false"
          RUN_FULL_FLOW: "true"
          CAPTURE_SCREENSHOTS: "true"
          SCREENSHOT_DIR: "ci-screenshots"
          BRIGHTDATA_USERNAME: ${{ secrets.BRIGHTDATA_USERNAME }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c "export DISPLAY=:99 && python main.py"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-headed-${{ github.run_id }}
          path: ci-screenshots/
          if-no-files-found: ignore
